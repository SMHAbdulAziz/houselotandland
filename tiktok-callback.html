<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<title>TikTok Connected | House Lot &amp; Land Sales Co.</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f2;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #111; }
  .card { width: min(560px, 92vw); background: #fff; border: 1px solid #e3e3e0; border-radius: 14px;
          padding: 36px 32px; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  .brand { font-weight: 800; letter-spacing: .5px; font-size: 20px; line-height: 1.2; }
  .brand small { display: block; font-size: 13px; font-weight: 600; color: #555; letter-spacing: 1.5px; }
  h1 { font-size: 24px; margin: 26px 0 8px; }
  p { color: #444; line-height: 1.5; margin: 8px 0; }
  .code { margin: 18px 0 10px; padding: 12px; background: #f6f6f4; border: 1px dashed #bbb; border-radius: 8px;
          font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; text-align: left; }
  button { background: #111; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .err { color: #b00020; }
  .foot { margin-top: 26px; font-size: 13px; color: #777; }
  .foot a { color: #111; }
</style>
</head>
<body>
<main class="card">
  <img src="/images/Menu-Logo.png" alt="House Lot &amp; Land Sales Co. LLC" style="max-width:260px;width:70%;height:auto">
  <h1 id="title">TikTok connected</h1>
  <p id="msg">Your TikTok account authorized HLL Social Poster. Copy the code below into the setup tool, then close this window.</p>
  <div id="codebox" class="code" hidden></div>
  <button id="copy" hidden>Copy code</button>
  <p class="foot">House Lot &amp; Land Sales Co. LLC · <a href="/">houselotandland.org</a> · 214-702-1519<br><a href="/terms.html">Terms of Use</a> · <a href="/privacy.html">Privacy Policy</a></p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error"), errDesc = q.get("error_description");
  const box = document.getElementById("codebox"), btn = document.getElementById("copy");
  if (code) {
    box.textContent = code; box.hidden = false; btn.hidden = false;
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(code); btn.textContent = "Copied"; }
      catch (e) { const r = document.createRange(); r.selectNodeContents(box);
                  const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Press Cmd+C"; }
    };
  } else if (err) {
    document.getElementById("title").textContent = "TikTok was not connected";
    const m = document.getElementById("msg"); m.className = "err";
    m.textContent = (errDesc || err) + ". Close this window and try again.";
  } else {
    document.getElementById("msg").textContent = "This page completes the TikTok sign-in for House Lot & Land's posting tool. You can close this window.";
  }
</script>
<script type="module" src="/js/shabbat-banner.js"></script>
</body>
</html>
